<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entreprises Tunisie-France Cybersécurité - Stages 2021-2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#0a0e1a;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1f3a 0%,#0d1117 100%);padding:30px 20px;text-align:center;border-bottom:2px solid #ff6b35}
.header h1{font-size:2em;color:#ff6b35;margin-bottom:10px;text-shadow:0 0 20px rgba(255,107,53,0.3)}
.header p{color:#8892b0;font-size:1.05em}
.stats-bar{display:flex;justify-content:center;gap:20px;margin-top:15px;flex-wrap:wrap}
.stat{background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.3);padding:8px 18px;border-radius:20px;font-size:14px}
.stat strong{color:#ff6b35}
.controls{padding:20px;max-width:1400px;margin:0 auto}
.search-box{width:100%;padding:14px 20px;font-size:16px;border:2px solid #1e2a4a;border-radius:10px;background:#0f1629;color:#fff;margin-bottom:15px;transition:border-color .3s}
.search-box:focus{outline:none;border-color:#ff6b35;box-shadow:0 0 15px rgba(255,107,53,0.2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.filter-select{padding:10px 15px;border:1px solid #1e2a4a;border-radius:8px;background:#0f1629;color:#e0e0e0;font-size:14px;cursor:pointer}
.filter-select:focus{outline:none;border-color:#ff6b35}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tag{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #2a3a5a;background:#0f1629;color:#8892b0;transition:all .3s}
.tag:hover,.tag.active{background:rgba(255,107,53,0.15);border-color:#ff6b35;color:#ff6b35}
.results-info{padding:10px 0;color:#8892b0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:15px;padding:0 0 40px}
.card{background:#111827;border:1px solid #1e2a4a;border-radius:12px;padding:18px;transition:all .3s;overflow:hidden}
.card:hover{border-color:#ff6b35;transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,107,53,0.1)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card h3{font-size:1.05em;color:#fff;margin-bottom:4px}
.card .category{font-size:11px;padding:3px 8px;border-radius:4px;background:rgba(255,107,53,0.1);color:#ff6b35;white-space:nowrap}
.card .info{font-size:13px;color:#8892b0;margin:4px 0}
.card .info span{color:#a0aec0}
.card .tags-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.card .mini-tag{font-size:10px;padding:2px 7px;border-radius:3px;background:rgba(139,92,246,0.15);color:#a78bfa;border:1px solid rgba(139,92,246,0.3)}
.card a{color:#ff6b35;text-decoration:none;font-size:12px}
.card a:hover{text-decoration:underline}
.flag{font-size:12px}
.pagination{display:flex;justify-content:center;gap:8px;padding:20px 0 40px;flex-wrap:wrap}
.page-btn{padding:8px 14px;border:1px solid #1e2a4a;border-radius:6px;background:#0f1629;color:#8892b0;cursor:pointer;transition:all .3s}
.page-btn:hover,.page-btn.active{background:rgba(255,107,53,0.15);border-color:#ff6b35;color:#ff6b35}
@media(max-width:768px){.header h1{font-size:1.4em}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
<h1>🇹🇳🔐🇫🇷 Entreprises Tunisie ↔ France - Cybersécurité</h1>
<p>Entreprises présentes en Tunisie ET en France ayant proposé des stages/postes cyber (2021-2026)</p>
<div class="stats-bar">
<div class="stat"><strong id="total-count">0</strong> entreprises</div>
<div class="stat"><strong id="filtered-count">0</strong> résultats</div>
<div class="stat">Sources: LinkedIn, Indeed, WTTJ, Sites carrières</div>
</div>
</div>
<div class="controls">
<input type="text" class="search-box" id="search" placeholder="🔍 Rechercher par nom, ville Tunisie/France, spécialité...">
<div class="filters">
<select class="filter-select" id="filter-category">
<option value="">Toutes catégories</option>
<option value="Big4 / Cabinet Conseil">Big4 / Cabinet Conseil</option>
<option value="ESN / Consulting IT">ESN / Consulting IT</option>
<option value="Entreprise avec équipe cyber">Entreprise avec équipe cyber</option>
<option value="Éditeur / Solutions">Éditeur / Solutions</option>
<option value="Telecom / Cloud">Telecom / Cloud</option>
<option value="Pure Player Cyber">Pure Player Cyber</option>
<option value="Intégrateur / MSSP">Intégrateur / MSSP</option>
<option value="Formation / Certification">Formation / Certification</option>
</select>
<select class="filter-select" id="filter-tn">
<option value="">Toutes villes Tunisie</option>
<option value="Tunis">Tunis</option>
<option value="Sousse">Sousse</option>
</select>
<select class="filter-select" id="filter-fr">
<option value="">Toutes villes France</option>
<option value="Paris">Paris</option>
<option value="Lyon">Lyon</option>
<option value="Toulouse">Toulouse</option>
<option value="Grenoble">Grenoble</option>
<option value="Strasbourg">Strasbourg</option>
</select>
<select class="filter-select" id="filter-size">
<option value="">Toutes tailles</option>
<option value="TPE">TPE (1-10)</option>
<option value="PME">PME (11-250)</option>
<option value="ETI">ETI (251-5000)</option>
<option value="GE">Grande Entreprise (5000+)</option>
</select>
</div>
<div class="tags" id="specialty-tags"></div>
<div class="results-info" id="results-info"></div>
<div class="grid" id="grid"></div>
<div class="pagination" id="pagination"></div>
</div>
<script src="tunisie-france-data.js"></script>
<script>
const COMPANIES=COMPANIES_TN_FR;
const PER_PAGE=24;
let page=1,filtered=[...COMPANIES],activeSp='';
const specialties=[...new Set(COMPANIES.flatMap(c=>c.sp))].sort();
const tagsEl=document.getElementById('specialty-tags');
specialties.forEach(s=>{const t=document.createElement('span');t.className='tag';t.textContent=s;t.onclick=()=>{if(activeSp===s){activeSp='';t.classList.remove('active')}else{document.querySelectorAll('.tag').forEach(x=>x.classList.remove('active'));activeSp=s;t.classList.add('active')}page=1;apply()};tagsEl.appendChild(t)});
document.getElementById('total-count').textContent=COMPANIES.length;
['search','filter-category','filter-tn','filter-fr','filter-size'].forEach(id=>{document.getElementById(id).addEventListener(id==='search'?'input':'change',()=>{page=1;apply()})});
function apply(){
const q=document.getElementById('search').value.toLowerCase();
const cat=document.getElementById('filter-category').value;
const tn=document.getElementById('filter-tn').value;
const fr=document.getElementById('filter-fr').value;
const sz=document.getElementById('filter-size').value;
filtered=COMPANIES.filter(c=>{
if(cat&&c.c!==cat)return false;
if(tn&&!c.vtn.toLowerCase().includes(tn.toLowerCase()))return false;
if(fr&&!c.vfr.toLowerCase().includes(fr.toLowerCase()))return false;
if(sz&&c.t!==sz)return false;
if(activeSp&&!c.sp.includes(activeSp))return false;
if(q){const h=(c.n+' '+c.c+' '+c.vtn+' '+c.vfr+' '+c.sp.join(' ')+' '+c.s).toLowerCase();return h.includes(q)}
return true;
});
document.getElementById('filtered-count').textContent=filtered.length;
render();
}
function render(){
const g=document.getElementById('grid');
const start=(page-1)*PER_PAGE;
const items=filtered.slice(start,start+PER_PAGE);
document.getElementById('results-info').textContent=`Affichage ${start+1}-${Math.min(start+PER_PAGE,filtered.length)} sur ${filtered.length}`;
g.innerHTML=items.map(c=>`<div class="card">
<div class="card-header"><div><h3>${c.n}</h3><div class="info"><span class="flag">🇹🇳</span> ${c.vtn} → <span class="flag">🇫🇷</span> ${c.vfr} | 👥 ${c.t==='TPE'?'1-10':c.t==='PME'?'11-250':c.t==='ETI'?'251-5000':'5000+'}</div></div><span class="category">${c.c}</span></div>
<div class="info">🌐 <a href="https://${c.s}" target="_blank">${c.s}</a></div>
<div class="info">📢 ${c.sr}</div>
<div class="tags-row">${c.sp.map(s=>`<span class="mini-tag">${s}</span>`).join('')}</div>
</div>`).join('');
paginate();
}
function paginate(){
const tot=Math.ceil(filtered.length/PER_PAGE);
const p=document.getElementById('pagination');
if(tot<=1){p.innerHTML='';return}
let h='';
if(page>1)h+=`<button class="page-btn" onclick="go(${page-1})">◀</button>`;
for(let i=Math.max(1,page-3);i<=Math.min(tot,page+3);i++)h+=`<button class="page-btn ${i===page?'active':''}" onclick="go(${i})">${i}</button>`;
if(page<tot)h+=`<button class="page-btn" onclick="go(${page+1})">▶</button>`;
p.innerHTML=h;
}
function go(p2){page=p2;render();window.scrollTo({top:280,behavior:'smooth'})}
apply();
</script>
</body>
</html>
